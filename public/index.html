<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- `maximum-scale`/`minimum-scale`/`user-scalable=no` lock the page at 1x — without them,
         iOS Safari (and standalone/home-screen PWA mode, which this app opts into below) can get
         its viewport scale stuck below 1 after a text input is focused then blurred, leaving the
         whole app rendered shrunk into a corner until a manual pinch-zoom or reload. Pinch-zoom
         isn't a feature this app relies on, so trading it away avoids the whole bug class.
         `viewport-fit=cover` lets `env(safe-area-inset-*)` resolve on notched devices. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover, shrink-to-fit=no"
    />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->

         preloaded so they download alongside the app code instead of after it. -->

    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        /* Same cobalt as the splash, so there's never a white frame before the app paints. */
        background: #2b4bff;
      }
      /* Launch screen: the splash (screenshot of its final layout) shown before any JS runs.
         Lives outside #root and is faded out by hideBoot() (src/ui/Boot.tsx) once the app is ready. */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        background: #2b4bff;
        transition: opacity 0.24s ease-out;
      }
      #boot.gone {
        opacity: 0;
        pointer-events: none;
      }
      #boot .col {
        position: relative;
        height: 100%;
        max-width: 480px;
        margin: 0 auto;
        overflow: hidden;
        background-color: #2b4bff;
        background-image: radial-gradient(circle at 50% 35%, rgba(158, 179, 255, 0.6), rgba(43, 75, 255, 0) 55%),
          radial-gradient(circle, rgba(255, 255, 255, 0.1) 1.2px, transparent 1.2px);
        background-size: 100% 100%, 16px 16px;
      }
      #boot .hero {
        position: absolute;
        left: 50%;
        margin-left: -195px;
        top: calc(max(env(safe-area-inset-top), 14px) - 14px);
        width: 390px;
        height: 690px;
      }
      #boot .go {
        position: absolute;
        left: 40px;
        right: 40px;
        bottom: 44px;
        height: 59px;
        box-sizing: border-box;
        border: 2px solid #111;
        border-radius: 20px;
        background: #ffd23f;
        box-shadow: 5px 5px 0 #111;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #boot .go.down {
        transform: translate(4px, 4px);
        box-shadow: 1px 1px 0 #111;
      }
      #boot .go img {
        width: 148px;
        height: 35px;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>

    <!-- "Add to Home Screen" icon for Android/Chrome (via the web manifest) and other PWA-aware browsers. -->
    <link rel="preload" as="image" href="/launch-hero.webp" fetchpriority="high" />
    <link rel="manifest" href="/manifest.json" />
    <!-- iOS Safari ignores the manifest for its home-screen icon and looks for this instead. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Opts the page into iOS's standalone (no browser chrome) mode when launched from the home screen. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#2B4BFF" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Myspace" />
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
    <!-- Launch screen, shown until the app is ready (see #boot above). -->
    <div id="boot" aria-hidden="true">
      <div class="col">
        <img class="hero" src="/launch-hero.webp" alt="" />
        <div class="go"><img src="/launch-step-inside.webp" alt="" /></div>
      </div>
    </div>
    <script>
      // The URL the app was opened with (before sign-in redirects are cleaned out of it), and a
      // "Step inside" tap made while the app is still loading — the app acts on it once ready.
      window.__launchUrl = location.href;
      // Offline cache: keeps the app on the phone so it opens instantly (see scripts/sw.js).
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {});
        });
      }
      (function () {
        var go = document.querySelector('#boot .go');
        if (!go) return;
        go.addEventListener('click', function () {
          window.__bootGo = true;
          go.classList.add('down');
        });
      })();
    </script>

    <!-- iOS Safari's keyboard-avoidance shifts the whole page up while a text input is focused
         (there's nothing to opt out of — it's not `body`'s own scroll, which `overflow: hidden`
         above already blocks, but the browser's outer visual-viewport offset). Once the keyboard
         closes, that offset is supposed to unwind on its own; in practice — especially in
         standalone/home-screen mode with `user-scalable=no` above, which removes the pinch-zoom
         mechanism iOS otherwise reconciles this through — it can get stuck, leaving the header
         scrolled off the top of the screen until a manual scroll or reload. Forcing the scroll
         position back to the origin whenever the visual viewport's own size/offset settles (i.e.
         the keyboard finished animating open or closed) is the standard fix: a no-op on every
         normal resize, and a correction on exactly the runs that got stuck. -->
    <script>
      (function () {
        var reset = function () {
          window.scrollTo(0, 0);
          document.documentElement.scrollTop = 0;
          document.body.scrollTop = 0;
        };
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', function () {
            setTimeout(reset, 50);
          });
          window.visualViewport.addEventListener('scroll', function () {
            setTimeout(reset, 50);
          });
        }
        document.addEventListener(
          'focusout',
          function () {
            setTimeout(reset, 50);
            setTimeout(reset, 350);
          },
          true,
        );
      })();
    </script>
  </body>
</html>
